name: Test Package

on:
  workflow_dispatch:       # запуск вручную

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8","3.9","3.10","3.11","3.12","3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build hatchling pytest soundfile
        pip install .[test]
        pip install .[onnx-cpu]

    - name: Build package
      run: python -m build --wheel --outdir dist

    - name: Install package
      run: |
        import glob, subprocess, sys
        whl = glob.glob("dist/*.whl")[0]
        subprocess.check_call([sys.executable, "-m", "pip", "install", whl])
      shell: python

    - name: Run tests
      run: pytest tests

  # The torchcodec audio backend cannot be covered by the matrix above: it needs
  # Python >= 3.9, FFmpeg on the system, and a torch release matching its own,
  # while the `test` extra pins torch < 2.9. Exercise it once on a current stack
  # so the torchaudio-less I/O path does not go untested.
  test-codec:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest soundfile
        pip install .[audio,codec,onnx-cpu]

    - name: Report backend versions
      run: |
        python - <<'PY'
        import torch, torchaudio, torchcodec
        print("torch", torch.__version__)
        print("torchaudio", torchaudio.__version__)
        print("torchcodec", torchcodec.__version__)
        PY

    - name: Verify torchcodec can decode
      # Fail loudly here rather than letting the backend tests skip silently.
      run: |
        python - <<'PY'
        from torchcodec.decoders import AudioDecoder
        samples = AudioDecoder("tests/data/test.wav").get_all_samples()
        print("decoded", samples.data.shape, "at", samples.sample_rate)
        PY

    - name: Run tests
      run: pytest tests -v
